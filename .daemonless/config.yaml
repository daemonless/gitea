icon: ':simple-gitea:'

cit:
  mode: screenshot
  port: 3000
  ssim_threshold: 0.85
  ready: "Starting new Web server"
  puid_ignore:
    - /config/ssh

build:
  architectures:
    - amd64
  variants:
    - tag: latest
      containerfile: Containerfile
      default: true
    - tag: pkg
      containerfile: Containerfile.pkg
    - tag: pkg-latest
      containerfile: Containerfile.pkg
      args:
        BASE_VERSION: "15.1-latest"
